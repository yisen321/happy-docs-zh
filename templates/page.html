<body><div id="app"><div class="site-shell document-site-shell docs-shell">

<main class="docs-layout page-width"><aside class="docs-sidebar"><nav class="docs-navigation" aria-label="文档导航">{{NAVIGATION}}</nav></aside>
<article class="document-article" data-document="{{SLUG}}"><div class="document-content">{{CONTENT}}</div>
<nav class="document-pagination" aria-label="文档上一页与下一页">{{PAGINATION}}</nav>
<footer class="site-footer"><div class="page-width footer-inner"><p class="footer-statement">我们围绕智能体构建交互界面：让你掌控它们的方式、它们运行的方式，以及团队与它们共享上下文的方式。<span class="footer-people"><a href="https://x.com/Ex3NDR" target="_blank" rel="noopener noreferrer">@Ex3NDR</a> 与 <a href="https://x.com/bra1n_dump" target="_blank" rel="noopener noreferrer">@bra1n_dump</a></span></p><div class="footer-meta"><div class="footer-links" aria-label="页脚导航"><a href="{{HOME}}">文档</a><a href="{{DESKTOP}}">桌面应用</a><a href="{{MOBILE}}">手机应用</a><a href="{{PRIVACY}}"{{PRIVACYSTATE}}>隐私政策</a><a href="{{TERMS}}"{{TERMSSTATE}}>服务条款</a><a class="footer-link-quiet" href="https://happy.engineering/docs/">原版 Happy CLI</a></div><a class="wordmark" href="https://happy.engineering/" aria-label="Happy Engineering 官方首页">Happy<span>Engineering</span></a><p class="footer-descriptor">在同一款应用中编排 Claude、Codex、Grok、Gemini 等智能体</p><p>© 2026 Happy Engineering</p><p>非官方中文翻译 · <a href="{{ORIGINAL}}" data-original="true">查看本页原文</a></p></div></div></footer>
</article></main></div></div>
<script>
/* 仅复现原站移动端导航，点击站内链接后收起。 */
const trail=document.querySelector('.docs-mobile-trail');
const menu=document.getElementById('docs-mobile-menu');
trail.addEventListener('click',()=>{const expanded=trail.getAttribute('aria-expanded')==='true';trail.setAttribute('aria-expanded',String(!expanded));menu.hidden=expanded;});
menu.addEventListener('click',event=>{if(event.target.closest('a')){menu.hidden=true;trail.setAttribute('aria-expanded','false');}});
</script>
</body></html>
